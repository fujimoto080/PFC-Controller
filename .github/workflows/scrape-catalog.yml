name: Update catalog

# お店ごとの栄養成分一覧 (data/*.json) を週 1 回取り直し、変わっていれば main にコミットする。
# 一部のお店で失敗しても、取れたお店の分はコミットする（ジョブは失敗にして気付けるようにする）。
# main への push で Vercel が再デプロイし、組み合わせ提案 API に反映される。
on:
  schedule:
    # 毎週月曜 4:00 JST
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scrape
        run: pnpm scrape:catalog

      - name: Commit
        if: always()
        run: |
          git diff --quiet -- data && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Update the store nutrition catalogs'
          git push
